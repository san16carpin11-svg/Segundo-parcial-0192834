<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloth Store | New Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/styles.css">
</head>
<body>
  <div class="page">

    <header class="top">
      <div class="top__left">
        <button class="menu" aria-label="Menú">
          <svg width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 2h24M1 9h16M1 16h9"/></svg>
        </button>
        <nav class="links" aria-label="Principal">
          <a href="#">Home</a>
          <a href="#">Collections</a>
          <a href="#">New</a>
        </nav>
      </div>

      <a class="logo" href="#" aria-label="Inicio">
        <svg width="34" height="44" viewBox="0 0 34 44"><path d="M4 2l28 20L4 42z" fill="#000"/></svg>
      </a>

      <div class="top__right">
        <button class="circle circle--dark btn-heart" aria-label="Favoritos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>
        </button>
        <div class="cart">
          <span class="cart__label">Cart</span>
          <button class="circle circle--ring" aria-label="Carrito">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/></svg>
          </button>
        </div>
        <button class="circle circle--dark" aria-label="Cuenta">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>
        </button>
      </div>
    </header>

    <main class="hero">
      <section class="panel">
        <ul class="cats">
          <li><a href="#">Men</a></li>
          <li><a href="#">Women</a></li>
          <li><a href="#">Kids</a></li>
        </ul>

        <form class="search" role="search" onsubmit="return false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" placeholder="Search" aria-label="Buscar">
        </form>

        <div class="title">
          <h1>New<br>Collection</h1>
          <p>Summer<br>2024</p>
        </div>

        <div class="cta-row">
          <a class="cta" href="#">Go To Shop
            <svg width="60" height="12" viewBox="0 0 60 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 6h58M53 1l5 5-5 5"/></svg>
          </a>
          <div class="arrows">
            <button aria-label="Anterior">&lsaquo;</button>
            <button aria-label="Siguiente">&rsaquo;</button>
          </div>
        </div>
      </section>

      <section class="gallery" aria-label="Productos">
        <figure class="card">
         <img src="assets/pantalon.jpg.png" alt="Pantalón blanco con botas">
          <figcaption>
            <small>Cotton T-Shirt</small>
            <span>Full Sleeve Zipper</span><b>$199</b>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="assets/camiseta.png" alt="Camiseta negra bordada">
          <figcaption>
            <small>Cotton T-Shirt</small>
            <span>Full Sleeve Zipper</span><b>$199</b>
          </figcaption>
        </figure>
      </section>
    </main>

  </div>
</body>
</html>
